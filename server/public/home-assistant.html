<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Home Assistant — Hearth-Connect</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="home-assistant-page">
  <div class="page" id="haRoot">
    <header class="control-header ha-header">
      <div id="haStatus" class="ha-status ha-status-info">Loading…</div>
      <div id="haEditBar" class="ha-editbar"></div>
    </header>

    <button id="haGearBtn" class="ha-gear-btn" title="Home Assistant settings" aria-label="Home Assistant settings">⚙</button>

    <div id="haTabs" class="ha-tabs"></div>

    <div id="haTiles" class="ha-tiles"></div>

    <div id="haSettingsOverlay" class="ha-picker-overlay hidden">
      <div class="ha-picker ha-settings">
        <div class="ha-picker-head">
          <h3>Home Assistant</h3>
          <button id="haSettingsClose" class="ha-btn">Close</button>
        </div>
        <p class="ha-settings-hint">Connects the hub to Home Assistant. The long-lived token is stored only on the hub and is never shown back.</p>
        <label class="ha-settings-row">URL
          <input type="text" id="haUrl" placeholder="http://homeassistant.local:8123" autocomplete="off">
        </label>
        <label class="ha-settings-row">Long-lived token
          <input type="password" id="haToken" placeholder="paste token (write-only)" autocomplete="off">
        </label>
        <div class="ha-settings-row" id="haConfiguredNote"></div>
        <button class="ha-btn ha-save" id="haSaveBtn">Save</button>
      </div>
    </div>

    <div id="haPickerOverlay" class="ha-picker-overlay hidden">
      <div class="ha-picker">
        <div class="ha-picker-head">
          <h3>Add entities</h3>
          <button id="haPickerClose" class="ha-btn">Close</button>
        </div>
        <input id="haPickerSearch" class="ha-picker-search" type="text" placeholder="Search lights, switches, climate…">
        <div id="haPickerList" class="ha-picker-list"></div>
        <button id="haPickerOk" class="ha-btn ha-save">Add selected</button>
      </div>
    </div>
  </div>

  <script src="/js/signaling.js"></script>
  <script src="/js/home-assistant.js"></script>
  <script src="/js/topbar.js"></script>
</body>
</html>
